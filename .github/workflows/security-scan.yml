name: Security Scan

# セキュリティスキャンワークフロー
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 毎日午前3時（UTC）にセキュリティスキャン実行
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Security scan type'
        required: true
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - deep
      notification_level:
        description: 'Notification level'
        required: true
        default: 'normal'
        type: choice
        options:
          - minimal
          - normal
          - detailed

# 環境変数
env:
  SCAN_TYPE: ${{ github.event.inputs.scan_type || 'full' }}
  NOTIFICATION_LEVEL: ${{ github.event.inputs.notification_level || 'normal' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # 静的コード解析
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      vulnerabilities-found: ${{ steps.analyze.outputs.vulnerabilities-found }}
      security-score: ${{ steps.analyze.outputs.security-score }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint security scan
        id: eslint-security
        run: |
          echo "🔍 ESLint セキュリティスキャン実行中..."
          
          # セキュリティ関連のESLintルール実行
          npx eslint . --ext .ts,.js --format json --output-file eslint-security-results.json || true
          
          # 結果解析
          if [[ -f "eslint-security-results.json" ]]; then
            ESLINT_ISSUES=$(jq length eslint-security-results.json 2>/dev/null || echo "0")
            echo "ESLint issues found: $ESLINT_ISSUES"
            echo "eslint-issues=$ESLINT_ISSUES" >> $GITHUB_OUTPUT
          else
            echo "eslint-issues=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Run npm audit
        id: npm-audit
        run: |
          echo "🔍 npm audit セキュリティスキャン実行中..."
          
          # npm auditの実行
          set +e
          npm audit --audit-level high --json > npm-audit-results.json 2>&1
          AUDIT_EXIT_CODE=$?
          set -e
          
          # 結果解析
          if [[ -f "npm-audit-results.json" ]]; then
            if command -v jq >/dev/null 2>&1; then
              HIGH_VULNS=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-results.json)
              CRITICAL_VULNS=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-results.json)
              TOTAL_VULNS=$((HIGH_VULNS + CRITICAL_VULNS))
            else
              TOTAL_VULNS=$(grep -o '"high":[0-9]*' npm-audit-results.json | cut -d':' -f2 || echo "0")
            fi
          else
            TOTAL_VULNS=0
          fi
          
          echo "High/Critical vulnerabilities found: $TOTAL_VULNS"
          echo "npm-vulnerabilities=$TOTAL_VULNS" >> $GITHUB_OUTPUT
          echo "audit-exit-code=$AUDIT_EXIT_CODE" >> $GITHUB_OUTPUT
      
      - name: Run TypeScript security analysis
        id: typescript-security
        run: |
          echo "🔍 TypeScript セキュリティ分析実行中..."
          
          # TypeScriptコンパイルでの型安全性チェック
          if npx tsc --noEmit --strict; then
            echo "TypeScript security check: PASSED"
            echo "typescript-security=passed" >> $GITHUB_OUTPUT
          else
            echo "TypeScript security check: FAILED"
            echo "typescript-security=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: Analyze security results
        id: analyze
        run: |
          echo "📊 セキュリティ分析結果の評価中..."
          
          # 各スキャン結果の取得
          ESLINT_ISSUES="${{ steps.eslint-security.outputs.eslint-issues }}"
          NPM_VULNS="${{ steps.npm-audit.outputs.npm-vulnerabilities }}"
          TS_SECURITY="${{ steps.typescript-security.outputs.typescript-security }}"
          
          # セキュリティスコア計算
          SECURITY_SCORE=100
          
          # ESLint問題による減点
          if [[ $ESLINT_ISSUES -gt 0 ]]; then
            SECURITY_SCORE=$((SECURITY_SCORE - ESLINT_ISSUES * 5))
          fi
          
          # npm 脆弱性はここでは減点しない。
          # 依存関係の判定は dependency-scan ジョブ（重大度と許容リストで判定）が持つ。
          # ここで件数×20 を引くと、上流に修正が無い推移的依存が 1 つあるだけで
          # 恒久的に 80 を割り、静的解析の結果が読めなくなる。
          
          # TypeScript型安全性による減点
          if [[ "$TS_SECURITY" == "failed" ]]; then
            SECURITY_SCORE=$((SECURITY_SCORE - 30))
          fi
          
          # 最小値0に制限
          if [[ $SECURITY_SCORE -lt 0 ]]; then
            SECURITY_SCORE=0
          fi
          
          # 脆弱性判定
          TOTAL_VULNERABILITIES=$((ESLINT_ISSUES + NPM_VULNS))
          if [[ "$TS_SECURITY" == "failed" ]]; then
            TOTAL_VULNERABILITIES=$((TOTAL_VULNERABILITIES + 1))
          fi
          
          VULNERABILITIES_FOUND=$([ $TOTAL_VULNERABILITIES -gt 0 ] && echo "true" || echo "false")
          
          echo "vulnerabilities-found=$VULNERABILITIES_FOUND" >> $GITHUB_OUTPUT
          echo "security-score=$SECURITY_SCORE" >> $GITHUB_OUTPUT
          
          echo "📊 セキュリティ分析結果:"
          echo "  ESLint問題: $ESLINT_ISSUES"
          echo "  npm脆弱性: $NPM_VULNS"
          echo "  TypeScript安全性: $TS_SECURITY"
          echo "  セキュリティスコア: $SECURITY_SCORE/100"
          echo "  脆弱性検出: $VULNERABILITIES_FOUND"
      
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-results-${{ github.run_number }}
          path: |
            eslint-security-results.json
            npm-audit-results.json
          retention-days: 30

  # 依存関係脆弱性スキャン
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      dependency-vulnerabilities: ${{ steps.scan-deps.outputs.dependency-vulnerabilities }}
      scan-status: ${{ steps.scan-deps.outputs.scan-status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      
      # npm audit は lockfile だけで動くため npm ci は不要
      - name: Verify the audit gate detects an unallowed high
        run: python3 scripts/check-dependency-audit.py --selftest

      - name: Run dependency vulnerability gate
        id: scan-deps
        run: |
          echo "🔍 依存関係脆弱性ゲート実行中..."
          # 判定: critical / high は落とす（許容リストに理由と再確認期限があるものを除く）
          #       moderate / low は報告のみ
          # 対象: package-lock.json を持つ workspace すべて
          #       （root / docker/nextjs / lambda/agent-core-ad-sync）
          set +e
          python3 scripts/check-dependency-audit.py | tee dependency-audit-report.txt
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ $GATE_EXIT -eq 0 ]]; then
            echo "scan-status=pass" >> $GITHUB_OUTPUT
          else
            echo "scan-status=fail" >> $GITHUB_OUTPUT
          fi
          # 報告用の件数（判定には使わない）
          TOTAL=$(grep -cE '^  (critical|high|moderate|low) ' dependency-audit-report.txt || true)
          echo "dependency-vulnerabilities=$TOTAL" >> $GITHUB_OUTPUT
          exit $GATE_EXIT

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-scan-results-${{ github.run_number }}
          path: |
            dependency-audit-report.txt
          retention-days: 30

  # セキュリティゲート評価
  security-gate:
    name: Security Gate Evaluation
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-scan]
    if: always()
    
    outputs:
      security-gate-status: ${{ steps.evaluate.outputs.security-gate-status }}
      static-analysis-result: ${{ steps.evaluate.outputs.static-analysis-result }}
      dependency-result: ${{ steps.evaluate.outputs.dependency-result }}
    
    steps:
      - name: Evaluate security gate
        id: evaluate
        run: |
          echo "🔍 セキュリティゲート評価実行中..."
          # 判定は 2 つのジョブの結果をそのまま使う。
          # 以前は「脆弱性 1 件あたり −20 点、80 点未満で失敗」という算術で、
          # 上流に修正が無い推移的依存が 1 つでもあると恒久的に赤になり、
          # 赤であること自体が情報を持たなくなっていた。
          STATIC_RESULT="${{ needs.static-analysis.result }}"
          DEPENDENCY_RESULT="${{ needs.dependency-scan.result }}"
          DEPENDENCY_STATUS="${{ needs.dependency-scan.outputs.scan-status }}"

          if [[ "$STATIC_RESULT" == "success" && "$DEPENDENCY_RESULT" == "success" ]]; then
            GATE_STATUS="PASS"
          else
            GATE_STATUS="FAIL"
          fi

          echo "security-gate-status=$GATE_STATUS" >> $GITHUB_OUTPUT
          echo "static-analysis-result=$STATIC_RESULT" >> $GITHUB_OUTPUT
          echo "dependency-result=$DEPENDENCY_RESULT" >> $GITHUB_OUTPUT

          echo "📊 セキュリティゲート評価結果:"
          echo "  静的解析: $STATIC_RESULT"
          echo "  依存関係ゲート: $DEPENDENCY_RESULT（$DEPENDENCY_STATUS）"
          echo "  判定: $GATE_STATUS"
          echo ""
          echo "  依存関係ゲートの方針: critical / high は落とす"
          echo "  （.security/dependency-audit-allowlist.json に理由と再確認期限があるものを除く）"
          echo "  moderate / low は報告のみ"

      - name: Create security report
        run: |
          cat > security-report.md << EOF
          # セキュリティスキャンレポート
          
          ## 📊 セキュリティ評価結果
          
          | 項目 | 結果 | 状態 |
          |------|------|------|
          | 静的コード解析 | ${{ needs.static-analysis.outputs.security-score }}/100 | ${{ needs.static-analysis.outputs.vulnerabilities-found == 'false' && '✅ 安全' || '⚠️ 要確認' }} |
          | 依存関係脆弱性 | ${{ needs.dependency-scan.outputs.dependency-vulnerabilities }} 件 | ${{ needs.dependency-scan.outputs.scan-status == 'clean' && '✅ 安全' || '⚠️ 要対応' }} |
          | 依存関係ゲート（critical / high、許容リスト除く） | ${{ steps.evaluate.outputs.dependency-result }} | ${{ steps.evaluate.outputs.dependency-result == 'success' && '✅ 合格' || '❌ 不合格' }} |
          | 総合判定 | ${{ steps.evaluate.outputs.security-gate-status }} | ${{ steps.evaluate.outputs.security-gate-status == 'PASS' && '✅ 合格' || '❌ 不合格' }} |
          
          ## 🎯 セキュリティゲート結果
          
          **ステータス**: ${{ steps.evaluate.outputs.security-gate-status == 'PASS' && '✅ 合格' || '❌ 不合格' }}
          
          ${{ steps.evaluate.outputs.security-gate-status == 'PASS' && '🎉 セキュリティ基準を満たしています。' || '⚠️ セキュリティ問題が検出されました。修正が必要です。' }}
          
          ## 📋 推奨事項
          
          ${{ needs.dependency-scan.outputs.scan-status == 'critical' && '🚨 **緊急**: Critical脆弱性が検出されました。即座の対応が必要です。' || '' }}
          ${{ needs.dependency-scan.outputs.scan-status == 'high' && '⚠️ **重要**: High脆弱性が検出されました。早急な対応を推奨します。' || '' }}
          ${{ needs.static-analysis.outputs.vulnerabilities-found == 'true' && '🔍 **確認**: 静的解析で問題が検出されました。詳細を確認してください。' || '' }}
          ${{ steps.evaluate.outputs.security-gate-status == 'PASS' && '✅ **維持**: 現在のセキュリティレベルを維持してください。' || '' }}
          EOF
      
      - name: Upload security report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report-${{ github.run_number }}
          path: |
            security-report.md
            eslint-security-results.json
            npm-audit-results.json
          retention-days: 30
      
      - name: Comment PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const gateStatus = '${{ steps.evaluate.outputs.security-gate-status }}';
            const dependencyResult = '${{ steps.evaluate.outputs.dependency-result }}';
            const dependencyVulns = '${{ needs.dependency-scan.outputs.dependency-vulnerabilities }}';
            
            const emoji = gateStatus === 'PASS' ? '✅' : '❌';
            const status = gateStatus === 'PASS' ? '合格' : '不合格';
            
            const comment = `## ${emoji} セキュリティスキャン結果
            
            **ステータス**: ${status}  
            **依存関係ゲート**: ${dependencyResult}  
            **依存関係脆弱性**: ${dependencyVulns} 件  
            **スキャンタイプ**: ${{ env.SCAN_TYPE }}  
            
            ${gateStatus === 'PASS' ? 
              '🎉 セキュリティ基準を満たしています！' : 
              '⚠️ セキュリティ問題が検出されました。詳細はArtifactsを確認してください。'}
            
            **詳細レポート**: [セキュリティスキャン結果](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if security gate failed
        if: steps.evaluate.outputs.security-gate-status == 'FAIL'
        run: |
          echo "❌ セキュリティゲートが失敗しました"
          echo "依存関係ゲート: ${{ steps.evaluate.outputs.dependency-result }}"
          echo "依存関係脆弱性: ${{ needs.dependency-scan.outputs.dependency-vulnerabilities }} 件"
          exit 1

  # セキュリティ通知
  security-notification:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-scan, security-gate]
    if: always() && (needs.security-gate.outputs.security-gate-status == 'FAIL' || github.event.inputs.notification_level == 'detailed')
    
    steps:
      - name: Prepare security notification
        id: prepare
        run: |
          GATE_STATUS="${{ needs.security-gate.outputs.security-gate-status }}"
          DEPENDENCY_RESULT="${{ needs.security-gate.outputs.dependency-result }}"
          DEPENDENCY_VULNS="${{ needs.dependency-scan.outputs.dependency-vulnerabilities }}"
          
          if [[ "$GATE_STATUS" == "FAIL" ]]; then
            NOTIFICATION_TITLE="🚨 セキュリティアラート: 脆弱性検出"
            NOTIFICATION_COLOR="danger"
            URGENCY="HIGH"
          else
            NOTIFICATION_TITLE="🔍 セキュリティスキャン完了"
            NOTIFICATION_COLOR="good"
            URGENCY="INFO"
          fi
          
          NOTIFICATION_BODY="**セキュリティゲート**: $GATE_STATUS
          **依存関係ゲート**: $DEPENDENCY_RESULT
          **依存関係脆弱性**: $DEPENDENCY_VULNS 件
          **実行時刻**: $(date '+%Y/%m/%d %H:%M:%S UTC')
          **緊急度**: $URGENCY
          
          **詳細**: [セキュリティスキャン実行 #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          echo "notification-title<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTIFICATION_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "notification-body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTIFICATION_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create security summary
        run: |
          echo "## ${{ steps.prepare.outputs.notification-title }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.prepare.outputs.notification-body }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 詳細結果" >> $GITHUB_STEP_SUMMARY
          echo "- **静的解析**: ${{ needs.static-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **依存関係スキャン**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **セキュリティゲート**: ${{ needs.security-gate.result }}" >> $GITHUB_STEP_SUMMARY
      
      # 将来的にSlack通知を実装
      # - name: Send security alert to Slack
      #   if: env.SLACK_WEBHOOK_URL != ''
      #   run: |
      #     python3 development/scripts/notifications/slack-notifier.py \
      #       --webhook-url "$SLACK_WEBHOOK_URL" \
      #       --type alert \
      #       --data '{"alert_level": "${{ needs.security-gate.outputs.security-gate-status == 'FAIL' && 'high' || 'low' }}", "dependency_gate": "${{ needs.security-gate.outputs.dependency-result }}"}'
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # セキュリティサマリー
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-scan, security-gate, security-notification]
    if: always()
    
    steps:
      - name: Generate security summary
        run: |
          echo "🔒 セキュリティスキャン実行サマリー"
          echo ""
          echo "**スキャンタイプ**: ${{ env.SCAN_TYPE }}"
          echo "**静的解析**: ${{ needs.static-analysis.result }}"
          echo "**依存関係スキャン**: ${{ needs.dependency-scan.result }}"
          echo "**セキュリティゲート**: ${{ needs.security-gate.result }}"
          echo "**通知**: ${{ needs.security-notification.result }}"
          echo ""
          echo "**依存関係ゲート**: ${{ needs.security-gate.outputs.dependency-result }}"
          echo "**脆弱性検出**: ${{ needs.static-analysis.outputs.vulnerabilities-found }}"
          echo "**依存関係脆弱性**: ${{ needs.dependency-scan.outputs.dependency-vulnerabilities }} 件"
          echo ""
          echo "**実行時刻**: $(date '+%Y/%m/%d %H:%M:%S UTC')"
          echo "**ワークフロー**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          # 全体的な成功判定
          if [[ "${{ needs.security-gate.outputs.security-gate-status }}" == "PASS" ]]; then
            echo ""
            echo "✅ セキュリティスキャンが正常に完了しました"
          else
            echo ""
            echo "❌ セキュリティスキャンで問題が検出されました"
          fi