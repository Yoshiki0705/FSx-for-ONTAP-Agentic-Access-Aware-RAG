name: Continuous Monitoring & Alerts

# 継続的品質監視ワークフロー
#
# NOTE: 旧バージョンは jobs ブロックが壊れた YAML（リテラル \n）で「workflow file
# issue」により即時失敗していた。また gitignore 対象の development/ 配下スクリプトに
# 依存していたため CI では動作しなかった。本バージョンはリポジトリに実在する
# チェック（tsc / jest / cdk synth）を実行する、自己完結した有効な YAML に再構成。
on:
  schedule:
    # 毎日 02:00 UTC — 日次品質監視
    - cron: '0 2 * * *'
    # 毎週月曜 14:00 UTC — 週次
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      notification_level:
        description: 'Notification level'
        required: false
        default: 'normal'
        type: choice
        options:
          - minimal
          - normal
          - detailed

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality-monitoring:
    name: Continuous Quality Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        id: tsc
        run: npx tsc --noEmit

      - name: CDK unit tests
        id: jest
        run: npx jest --no-coverage --forceExit

      - name: CDK synth (default context)
        id: synth
        run: npx cdk synth --quiet

      - name: Monitoring summary
        if: always()
        env:
          TSC_OUTCOME: ${{ steps.tsc.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          SYNTH_OUTCOME: ${{ steps.synth.outcome }}
          TRIGGER: ${{ github.event_name }}
        run: |
          {
            echo "## 📊 継続的品質監視レポート"
            echo ""
            echo "**実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**トリガー**: ${TRIGGER}"
            echo ""
            echo "| チェック | 結果 |"
            echo "|---------|------|"
            echo "| TypeScript (tsc) | ${TSC_OUTCOME} |"
            echo "| Unit tests (jest) | ${JEST_OUTCOME} |"
            echo "| CDK synth | ${SYNTH_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
