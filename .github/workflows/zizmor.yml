name: GitHub Actions Security Lint (zizmor)

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # 毎週月曜 09:00 UTC (日本時間 18:00)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor (Actions Security Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          pip install zizmor

      - name: Run zizmor scan
        env:
          NO_COLOR: "1"
        run: |
          echo "🔍 GitHub Actions セキュリティリント実行中..."
          zizmor --format sarif . > zizmor-results.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

      - name: Run zizmor (human-readable output)
        run: |
          echo "📋 zizmor 結果サマリー:"
          zizmor . || true
