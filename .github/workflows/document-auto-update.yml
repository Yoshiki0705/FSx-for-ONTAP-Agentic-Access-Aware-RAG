name: Document Auto Update

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lib/**/*.ts'
      - 'lambda/**/*.ts'
      - 'lambda/**/*.py'
      - 'bin/**/*.ts'
      - 'docker/**/*'
      - 'scripts/**/*.sh'
      - 'development/scripts/**/*.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**/*.ts'
      - 'lambda/**/*.ts'
      - 'lambda/**/*.py'
      - 'bin/**/*.ts'
      - 'docker/**/*'
      - 'scripts/**/*.sh'
      - 'development/scripts/**/*.sh'

jobs:
  document-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup documentation system
      run: |
        if [ -f development/scripts/documentation/doc-auto-updater.sh ]; then
          chmod +x development/scripts/documentation/doc-auto-updater.sh
        fi
        if [ -f development/scripts/documentation/doc-quality-check.sh ]; then
          chmod +x development/scripts/documentation/doc-quality-check.sh
        fi
        mkdir -p development/logs/documentation
        mkdir -p development/docs/reports/local
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          lib/**/*.ts
          lambda/**/*.ts
          lambda/**/*.py
          bin/**/*.ts
          docker/**/*
          scripts/**/*.sh
          development/scripts/**/*.sh
    
    - name: Run document auto-update
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        if [ -f ./development/scripts/documentation/doc-auto-updater.sh ]; then
          ./development/scripts/documentation/doc-auto-updater.sh ${{ steps.changed-files.outputs.all_changed_files }}
        else
          echo "doc-auto-updater.sh not found, skipping"
        fi
    
    - name: Run document quality check
      run: |
        if [ -f ./development/scripts/documentation/doc-quality-check.sh ]; then
          ./development/scripts/documentation/doc-quality-check.sh
        else
          echo "doc-quality-check.sh not found, skipping"
        fi
    
    - name: Check for documentation changes
      id: doc-changes
      run: |
        if git diff --quiet HEAD -- README.md docs/; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit documentation updates
      if: steps.doc-changes.outputs.changes == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md docs/ development/docs/reports/local/
        git commit -m "docs: 自動ドキュメント更新 [skip ci]
        
        - ソースファイル変更に基づく自動更新
        - 品質チェック実行済み
        - 変更ファイル: ${{ steps.changed-files.outputs.all_changed_files }}"
        git push
    
    - name: Upload quality reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: document-quality-reports
        path: development/docs/reports/local/doc_*
        retention-days: 30
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // 最新の品質レポートを読み込み
          const reportsDir = 'development/docs/reports/local';
          const files = fs.readdirSync(reportsDir);
          const qualityReports = files.filter(f => f.startsWith('doc_quality_summary_'));
          
          if (qualityReports.length > 0) {
            const latestReport = qualityReports.sort().pop();
            const reportPath = path.join(reportsDir, latestReport);
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            
            const comment = `## 📚 ドキュメント自動更新結果
            
            ドキュメント自動更新システムが実行されました。
            
            ### 📊 品質チェック結果
            
            \`\`\`
            ${reportContent}
            \`\`\`
            
            ### 🔗 関連ファイル
            - [品質レポート](${reportPath})
            
            ---
            *このコメントは自動生成されました*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  document-quality-gate:
    runs-on: ubuntu-latest
    needs: document-update
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Setup documentation system
      run: |
        if [ -f development/scripts/documentation/doc-quality-check.sh ]; then
          chmod +x development/scripts/documentation/doc-quality-check.sh
        fi
        mkdir -p development/logs/documentation
    
    - name: Run quality gate check
      run: |
        if [ ! -f ./development/scripts/documentation/doc-quality-check.sh ]; then
          echo "⚠️ doc-quality-check.sh not found, skipping quality gate"
          exit 0
        fi
        
        ./development/scripts/documentation/doc-quality-check.sh
        
        # 品質スコアの確認
        if grep -q "平均スコア: [0-9][0-9]/100" development/docs/reports/local/doc_quality_summary_*.md; then
          score=$(grep "平均スコア:" development/docs/reports/local/doc_quality_summary_*.md | tail -1 | sed 's/.*平均スコア: \([0-9]*\).*/\1/')
          echo "Quality Score: $score"
          
          if [ "$score" -lt 80 ]; then
            echo "❌ 品質ゲート失敗: スコア $score < 80"
            exit 1
          else
            echo "✅ 品質ゲート成功: スコア $score >= 80"
          fi
        else
          echo "⚠️ 品質スコアを取得できませんでした"
        fi