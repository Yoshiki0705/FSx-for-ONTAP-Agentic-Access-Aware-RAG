version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Ignore major version updates for stable dependencies
    ignore:
      - dependency-name: "aws-cdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aws-cdk-lib"
        update-types: ["version-update:semver-major"]
      # cdk-nag v3 removes `NagSuppressions` in favor of `Validations.of().acknowledge()`
      # and reworks the engine from IAspect to IPolicyValidationPlugin (breaking change).
      # This project uses cdk-nag v2 with AwsSolutionsChecks enabled (#84, #104).
      # v3 migration requires rewriting all NagSuppressions → Validations.of().acknowledge()
      # across 5 stacks. Pin to v2 until migration is explicitly planned.
      - dependency-name: "cdk-nag"
        update-types: ["version-update:semver-major"]
    # Group updates for AWS SDK packages
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "constructs"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
