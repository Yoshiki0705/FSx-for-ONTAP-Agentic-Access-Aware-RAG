name: 'Quality Gate'
description: 'Permission-aware RAG System品質ゲート判定'
author: 'NetApp Japan Technology Team'

inputs:
  test-results-path:
    description: 'テスト結果JSONファイルのパス'
    required: true
  
  environment:
    description: '実行環境 (development/staging/production)'
    required: false
    default: 'staging'
  
  config-path:
    description: '品質ゲート設定ファイルのパス'
    required: false
    default: 'config/quality-gate/quality-gate.yml'
  
  output-path:
    description: 'レポート出力パス'
    required: false
    default: 'quality-reports/quality-report.md'
  
  fail-on-quality-gate:
    description: '品質ゲート失敗時にジョブを失敗させるか'
    required: false
    default: 'true'

outputs:
  gate-status:
    description: '品質ゲートステータス (PASS/WARN/FAIL)'
    value: ${{ steps.evaluate-quality.outputs.gate-status }}
  
  overall-score:
    description: '総合品質スコア'
    value: ${{ steps.evaluate-quality.outputs.overall-score }}
  
  blocking-failures:
    description: 'ブロッキング失敗の数'
    value: ${{ steps.evaluate-quality.outputs.blocking-failures }}
  
  warnings:
    description: '警告の数'
    value: ${{ steps.evaluate-quality.outputs.warnings }}
  
  report-path:
    description: '生成されたレポートのパス'
    value: ${{ steps.evaluate-quality.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        echo "📦 Python依存関係をインストール中..."
        pip install --quiet pyyaml

    - name: Prepare quality gate environment
      shell: bash
      run: |
        echo "🔧 品質ゲート環境を準備中..."
        
        # 必要なディレクトリの作成
        mkdir -p quality-reports
        mkdir -p test-results
        
        # スクリプトに実行権限を付与
        chmod +x scripts/ci/quality-gate.py
        
        # 設定ファイルの存在確認
        if [[ ! -f "${{ inputs.config-path }}" ]]; then
          echo "⚠️ 品質ゲート設定ファイルが見つかりません: ${{ inputs.config-path }}"
          echo "デフォルト設定を使用します"
        fi
        
        # テスト結果ファイルの存在確認
        if [[ ! -f "${{ inputs.test-results-path }}" ]]; then
          echo "❌ テスト結果ファイルが見つかりません: ${{ inputs.test-results-path }}"
          echo "ダミーのテスト結果を作成します"
          
          cat > "${{ inputs.test-results-path }}" << 'EOF'
        {
          "summary": {
            "total_tests": 0,
            "passed_tests": 0,
            "failed_tests": 0,
            "success_rate": 0,
            "execution_time_ms": 0
          }
        }
        EOF
        fi

    - name: Evaluate quality metrics
      id: evaluate-quality
      shell: bash
      run: |
        echo "📊 品質メトリクス評価を実行中..."
        echo "  環境: ${{ inputs.environment }}"
        echo "  設定ファイル: ${{ inputs.config-path }}"
        echo "  テスト結果: ${{ inputs.test-results-path }}"
        
        # 品質ゲート実行
        set +e  # エラーでも継続
        python3 scripts/ci/quality-gate.py \
          --config "${{ inputs.config-path }}" \
          --environment "${{ inputs.environment }}" \
          --test-results "${{ inputs.test-results-path }}" \
          --output "${{ inputs.output-path }}" \
          --verbose > quality_gate_output.json 2>&1
        
        quality_gate_exit_code=$?
        set -e
        
        echo "品質ゲート終了コード: $quality_gate_exit_code"
        
        # 結果の解析
        if [[ -f "quality_gate_output.json" ]]; then
          # JSON出力から結果を抽出
          if command -v jq >/dev/null 2>&1; then
            gate_status=$(tail -n 20 quality_gate_output.json | jq -r '.final_status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
            overall_score=$(tail -n 20 quality_gate_output.json | jq -r '.overall_score // 0' 2>/dev/null || echo "0")
            blocking_failures=$(tail -n 20 quality_gate_output.json | jq -r '.blocking_failures | length // 0' 2>/dev/null || echo "0")
            warnings=$(tail -n 20 quality_gate_output.json | jq -r '.warnings | length // 0' 2>/dev/null || echo "0")
          else
            # jqが利用できない場合の代替処理
            gate_status="UNKNOWN"
            overall_score="0"
            blocking_failures="0"
            warnings="0"
            
            # 簡単なパターンマッチング
            if grep -q '"final_status": "PASS"' quality_gate_output.json 2>/dev/null; then
              gate_status="PASS"
            elif grep -q '"final_status": "WARN"' quality_gate_output.json 2>/dev/null; then
              gate_status="WARN"
            elif grep -q '"final_status": "FAIL"' quality_gate_output.json 2>/dev/null; then
              gate_status="FAIL"
            fi
          fi
        else
          echo "⚠️ 品質ゲート出力ファイルが見つかりません"
          gate_status="UNKNOWN"
          overall_score="0"
          blocking_failures="0"
          warnings="0"
        fi
        
        # GitHub Actions出力
        echo "gate-status=$gate_status" >> $GITHUB_OUTPUT
        echo "overall-score=$overall_score" >> $GITHUB_OUTPUT
        echo "blocking-failures=$blocking_failures" >> $GITHUB_OUTPUT
        echo "warnings=$warnings" >> $GITHUB_OUTPUT
        echo "report-path=${{ inputs.output-path }}" >> $GITHUB_OUTPUT
        
        # 結果サマリーの表示
        echo "📊 品質ゲート結果:"
        echo "  ステータス: $gate_status"
        echo "  総合スコア: $overall_score"
        echo "  ブロッキング失敗: $blocking_failures"
        echo "  警告: $warnings"
        echo "  レポート: ${{ inputs.output-path }}"
        
        # 品質ゲートの判定結果を保存
        echo "$quality_gate_exit_code" > quality_gate_exit_code.txt

    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: quality-gate-report-${{ github.run_number }}
        path: |
          ${{ inputs.output-path }}
          quality_gate_output.json
          quality_gate_exit_code.txt
        retention-days: 30

    - name: Generate GitHub summary
      if: always()
      shell: bash
      run: |
        echo "📄 GitHub Actionsサマリーを生成中..."
        
        # ステータスに応じた絵文字
        case "${{ steps.evaluate-quality.outputs.gate-status }}" in
          "PASS") status_emoji="✅" ;;
          "WARN") status_emoji="⚠️" ;;
          "FAIL") status_emoji="❌" ;;
          *) status_emoji="❓" ;;
        esac
        
        # GitHub Actions サマリーの生成
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## ${status_emoji} 品質ゲート結果
        
        | 項目 | 値 |
        |------|-----|
        | ステータス | ${status_emoji} ${{ steps.evaluate-quality.outputs.gate-status }} |
        | 総合スコア | ${{ steps.evaluate-quality.outputs.overall-score }}/100 |
        | 環境 | ${{ inputs.environment }} |
        | ブロッキング失敗 | ${{ steps.evaluate-quality.outputs.blocking-failures }} |
        | 警告 | ${{ steps.evaluate-quality.outputs.warnings }} |
        
        ### 📁 生成されたレポート
        - 詳細レポート: \`${{ inputs.output-path }}\`
        - 評価結果JSON: \`quality_gate_output.json\`
        
        $(if [[ "${{ steps.evaluate-quality.outputs.gate-status }}" == "PASS" ]]; then
          echo "🎉 **品質ゲート合格**: 全ての品質基準を満たしています。デプロイメントを継続できます。"
        elif [[ "${{ steps.evaluate-quality.outputs.gate-status }}" == "WARN" ]]; then
          echo "⚠️ **品質ゲート警告**: 一部の推奨基準が未達成ですが、デプロイメントは継続されます。"
        elif [[ "${{ steps.evaluate-quality.outputs.gate-status }}" == "FAIL" ]]; then
          echo "❌ **品質ゲート失敗**: 重要な品質基準が未達成です。問題を修正してください。"
        else
          echo "❓ **品質ゲート不明**: 評価結果を確認できませんでした。"
        fi)
        EOF

    - name: Comment PR with quality gate results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          const gateStatus = '${{ steps.evaluate-quality.outputs.gate-status }}';
          const overallScore = '${{ steps.evaluate-quality.outputs.overall-score }}';
          const blockingFailures = '${{ steps.evaluate-quality.outputs.blocking-failures }}';
          const warnings = '${{ steps.evaluate-quality.outputs.warnings }}';
          
          const statusEmoji = {
            'PASS': '✅',
            'WARN': '⚠️',
            'FAIL': '❌',
            'UNKNOWN': '❓'
          };
          
          const emoji = statusEmoji[gateStatus] || '❓';
          
          const comment = `## ${emoji} 品質ゲート結果
          
          **ステータス**: ${emoji} ${gateStatus}
          **総合スコア**: ${overallScore}/100
          **環境**: ${{ inputs.environment }}
          
          **詳細**:
          - ブロッキング失敗: ${blockingFailures}
          - 警告: ${warnings}
          
          ${gateStatus === 'PASS' ? 
            '🎉 品質基準を満たしています！' : 
            gateStatus === 'WARN' ?
            '⚠️ 一部の推奨基準が未達成ですが、継続可能です。' :
            '❌ 重要な品質基準が未達成です。修正が必要です。'
          }
          
          詳細レポートはArtifactsを確認してください。`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Fail if quality gate failed
      if: inputs.fail-on-quality-gate == 'true'
      shell: bash
      run: |
        # 品質ゲートの終了コードを確認
        if [[ -f "quality_gate_exit_code.txt" ]]; then
          quality_gate_exit_code=$(cat quality_gate_exit_code.txt)
          
          if [[ "$quality_gate_exit_code" != "0" ]]; then
            echo "❌ 品質ゲートが失敗しました"
            echo "ステータス: ${{ steps.evaluate-quality.outputs.gate-status }}"
            echo "スコア: ${{ steps.evaluate-quality.outputs.overall-score }}/100"
            echo "ブロッキング失敗: ${{ steps.evaluate-quality.outputs.blocking-failures }}"
            exit "$quality_gate_exit_code"
          fi
        fi
        
        echo "✅ 品質ゲートチェック完了"